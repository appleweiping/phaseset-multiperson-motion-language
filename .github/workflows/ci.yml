name: PhaseSet data-free core CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Windows Python ${{ matrix.python }}
    runs-on: windows-latest
    # Freeze native CPU pools before Torch/NumPy import, as in server witnesses.
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONHASHSEED: "0"
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.12.0"
            install_target: ".[test]"
            pytest_args: ""
          - python: "3.14.5"
            install_target: ".[signal,test]"
            pytest_args: ""

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install package and test tools
        run: python -m pip install --disable-pip-version-check -e "${{ matrix.install_target }}"
      - name: Audit the public tree
        run: python scripts/public_release_audit.py
      - name: Audit every reachable Git ref
        run: python scripts/audit_all_refs.py
      - name: Verify tracked-file manifest
        run: python scripts/release_manifest.py verify
      - name: Verify local Markdown links
        run: python scripts/check_local_links.py
      - name: Lint
        run: python -m ruff check src tests scripts
      - name: Test
        run: |
          python -B -c "import torch; print({'torch': torch.__version__, 'cpu_capability': torch.backends.cpu.get_cpu_capability(), 'num_threads': torch.get_num_threads(), 'num_interop_threads': torch.get_num_interop_threads(), 'mkldnn_available': torch.backends.mkldnn.is_available(), 'mkldnn_enabled': torch.backends.mkldnn.enabled}); assert torch.get_num_threads() == 1"
          python -B -m pytest -p no:cacheprovider -q ${{ matrix.pytest_args }}
      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Audit built wheel bytes
        run: python scripts/audit_release_artifact.py dist
      - name: Bind wheel modules and metadata to the Git index
        run: python scripts/verify_wheel_against_index.py dist

  portable-audit:
    name: Ubuntu public-tree and wheel audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.0"
          cache: pip
      - name: Install audit tool
        run: python -m pip install --disable-pip-version-check ruff==0.15.22
      - name: Audit the public tree
        run: python scripts/public_release_audit.py
      - name: Audit every reachable Git ref
        run: python scripts/audit_all_refs.py
      - name: Verify tracked-file manifest
        run: python scripts/release_manifest.py verify
      - name: Verify local Markdown links
        run: python scripts/check_local_links.py
      - name: Lint
        run: python -m ruff check src tests scripts
      - name: Build wheel without runtime dependency resolution
        run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Audit built wheel bytes
        run: python scripts/audit_release_artifact.py dist
      - name: Bind wheel modules and metadata to the Git index
        run: python scripts/verify_wheel_against_index.py dist
