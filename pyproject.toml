[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phaseset-core"
version = "0.2.1"
description = "Permutation-invariant periodic relation tokens for multi-person motion-language research"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "MIT"
license-files = ["LICENSE", "LICENSE_TMR.md"]
authors = [{ name = "PhaseSet contributors" }]
dependencies = [
  "numpy==2.4.6",
  "torch>=2.10,<2.13",
]

[project.scripts]
phaseset = "phaseset_core.cli:main"

[project.urls]
Repository = "https://github.com/appleweiping/phaseset-multiperson-motion-language"
Documentation = "https://github.com/appleweiping/phaseset-multiperson-motion-language/tree/main/docs"

[project.optional-dependencies]
# Canonical bytes are shared by the strict Windows and Linux formula paths.
# A matching formula bank alone is not full model/CUDA runtime qualification.
signal = [
  "numpy==2.4.6",
  "torch==2.12.0",
]
clip = [
  "requests==2.34.2",
  "transformers==4.57.3",
]
embody = [
  "smplx==0.1.28",
]
test = [
  "pytest==9.0.3",
  "ruff==0.15.22",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-p no:cacheprovider"

[tool.ruff]
target-version = "py312"
line-length = 100
